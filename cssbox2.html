<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS BOX 2</title>
   <style>
        .container{
        display: flex;
        justify-content: space-evenly;
        background-color: green;
        padding: 50px;
        }
        .container img{
            width: 400px;
        }
        .left {
            background-color: yellow;
            height: 500px;
            margin-right: 50px;
            float: left;
            width: 25%;
        }
        .right {
            background-color: red;
            height: 500px;
            float: right;
            width: 70%;
        }
        .left, .right{
            margin-top: 25px;
        }
         .left1 {
            background-color: yellow;
            height: 500px;
            margin-right: 10px;
            width: 25%;
        }
        .right1 {
            background-color: blue;
            height: 500px;
            float: right;
            width: 70%;
        }
        .left, .right1{
            margin-top: 25px;
        }
   </style>

</head>
<body>
    <div class="container">
        <img src="gambar/Screenshot 2025-08-04 133209.png" alt="">
        <img src="gambar/Screenshot 2025-08-04 133430.png" alt="">
        <img src="gambar/Screenshot 2025-08-04 134855.png" alt="">
        <img src="gambar/Screenshot 2025-10-18 123957.png" alt="">
    </div>
    <div>
        <div class="left"></div>
        <div class="right"></div>
        <div class="left"></div>
        <div class="right1"></div>
    </div>
</body>
</html>
