<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box 2</title>
    <style>
        body {
            margin: 20px;
            background-color: gold;
            font-family: Arial, sans-serif;
        }
        .container {
            width: 1000px;
            margin: auto;
        }
        .header {
            background-color: red;
            height: 60px;
            margin-bottom: 10px;
        }
        .left {
            background-color: yellow;
            width: 30%;
            height: 120px;
            float: left;
            margin-right: 10px;
        }
        .right-top {
            background-color: blue;
            width: 67%;
            height: 120px;
            float: left;
        }
        </style>
</head>
<body>
    <div class="container">
        <div class="header"></div>
        <div class="left"></div>
        <div class="right-top"></div>
        <div class="right-bottom"></div>
    </div>
</body>
</html>
